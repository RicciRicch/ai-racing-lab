[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    # pygame imports the deprecated pkg_resources module
    ignore:pkg_resources is deprecated:DeprecationWarning
    ignore:pkg_resources is deprecated:UserWarning
    # TensorFlow dependencies on Python 3.13 / NumPy 2
    ignore::DeprecationWarning:gast.*
    ignore::DeprecationWarning:keras.*
